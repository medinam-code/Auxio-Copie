name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build debug APK with Gradle
      run: ./gradlew app:packageDebug
    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary
        path: ./app/build/outputs/apk/debug/app-debug.apk
    - name: Publish APK as release asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="build-${{ github.run_number }}"
        gh release create "$TAG" ./app/build/outputs/apk/debug/app-debug.apk --title "Auxio mod ($TAG)" --notes "Auxio con widget personalizable: opacidad del fondo ajustable (hasta transparente) y dimensiones mas libres. Compilado en GitHub Actions."
